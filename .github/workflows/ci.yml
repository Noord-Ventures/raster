name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.4.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Generate
        run: |
          pnpm build
          pnpm build:registry
      - name: Types in the tarball
        run: |
          test -f packages/core/dist/index.d.ts
          test -f packages/react/dist/index.d.ts
      - name: Integrity tests
        run: pnpm test
      - name: Dead-host grep
        run: |
          if grep -R -E 'raster\.design|raster-pied|vercel\.app' registry --include='*.json'; then
            echo "Dead host found in generated registry JSON"
            exit 1
          fi
      - name: No leftover scoped package names
        run: |
          needles=(
            "$(printf '@%s/' 'raster')"
            "$(printf '@%s/raster' 'noord')"
            "$(printf '@%s/' 'rennvaldes')"
            "$(printf '@%s/' 'noordvc')"
            "$(printf '@%s/' 'noordai')"
          )
          for needle in "${needles[@]}"; do
            if grep -R -n -F "$needle" --exclude-dir=node_modules --exclude-dir=.git --exclude-dir=dist --exclude-dir=.next --exclude-dir=out --exclude-dir=public --exclude=pnpm-lock.yaml .; then
              echo "Leftover $needle package name found"
              exit 1
            fi
          done
      - name: Homepage is a specimen
        run: |
          page=apps/www/app/page.tsx
          writer=apps/www/app/specimen.ts
          if grep -n -E 'site-layout|SIL OFL|Raster 0\.3' "$page"; then
            echo "Homepage still carries docs-column or marketing copy"
            exit 1
          fi
          if [ "$(grep -o 'Inter' "$writer" | wc -l)" -ne 1 ]; then
            echo "Inter must be named once, in app/specimen.ts"
            exit 1
          fi
          if grep -n Inter "$page"; then
            echo "Inter must be written in app/specimen.ts, not page.tsx"
            exit 1
          fi
          grep -q 'WORD = "Raster"' "$writer"
          grep -q '{WORD}' "$page"
          grep -q 'A poster you can install.' "$writer"
          grep -q 'A design system on a modular grid.' "$writer"
          grep -q 'npx @noorddev/raster-cli init' "$writer"
          if grep -n '@noordvc' "$writer" "$page" apps/www/app/docs/page.tsx; then
            echo "User-facing install copy must say @noorddev, not @noordvc"
            exit 1
          fi
          if grep -n -E 'One ink|204 module|Crouwel|Müller-Brockmann' "$page" "$writer" apps/www/app/layout.tsx apps/www/app/social.ts; then
            echo "Homepage law must not use the old museum caption"
            exit 1
          fi
          grep -q 'DOOR = "https://getraster.com"' "$writer"
          grep -q 'HOST = "https://raster.noord.dev"' "$writer"
          grep -q 'openGraph' apps/www/app/social.ts
          grep -q 'summary_large_image' apps/www/app/social.ts
          grep -q '/og.png' apps/www/app/social.ts
          grep -q 'return new URL(HOST)' apps/www/app/social.ts
          grep -q 'absolute: WORD' apps/www/app/page.tsx
          test -f apps/www/public/og.png
          python3 -c '
          from pathlib import Path
          p = Path("apps/www/public/og.png").read_bytes()
          assert p[:8] == b"\x89PNG\r\n\x1a\n", "og.png is not a PNG"
          w = int.from_bytes(p[16:20], "big")
          h = int.from_bytes(p[20:24], "big")
          assert (w, h) == (1200, 630), f"og.png must be 1200×630, got {w}×{h}"
          '
          grep -q 'specimen-page' "$page"
          grep -q 'isSpecimenPath' apps/www/components/crumb-bar.tsx
          if grep -n 'if (isSpecimenPath(pathname)) return null' apps/www/components/crumb-bar.tsx; then
            echo "Homepage must keep the site crumb bar"
            exit 1
          fi
          if grep -n 'if (isSpecimenPath(pathname) || isFieldPath(pathname)) return null' apps/www/components/crumb-bar.tsx; then
            echo "Homepage must keep the site crumb bar"
            exit 1
          fi
          test -f apps/www/app/specimen.css
          if grep -n specimen-page apps/www/app/site.css; then
            echo "Specimen styles drifted back into site chrome"
            exit 1
          fi
          if grep -n 'padding: 1px;' apps/www/app/specimen.css; then
            echo "Specimen must stay flush on top and left"
            exit 1
          fi
          if grep -n 'padding: 0 1px 1px 0' apps/www/app/specimen.css; then
            echo "Homepage must open on the right and bottom"
            exit 1
          fi
          grep -q 'body:has(.specimen-page)' apps/www/app/specimen.css
          grep -q 'clip-path: inset(0)' apps/www/app/specimen.css
          if grep -n 'rgba(0,0,0,0.025)' packages/core/src/tokens.ts; then
            echo "Module grid-line must read; 0.025 is invisible on paper"
            exit 1
          fi
          if grep -n 'rgba(255,255,255,0.01)' packages/core/src/tokens.ts; then
            echo "Dark module grid-line must read; 0.01 is invisible"
            exit 1
          fi
          node -e '
            const { readFileSync } = require("node:fs");
            const css = readFileSync("apps/www/app/specimen.css", "utf8");
            const hasAt = css.indexOf("body:has(.specimen-page)");
            if (hasAt < 0) {
              console.error("Homepage must keep body:has(.specimen-page)");
              process.exit(1);
            }
            const hasRule = css.slice(hasAt, css.indexOf("}", hasAt));
            if (hasRule.includes("background-image: none")) {
              console.error("Homepage must not hide the site module grid");
              process.exit(1);
            }
            if (!hasRule.includes("background-image: var(--grid-image)")) {
              console.error("Homepage must keep the site module grid");
              process.exit(1);
            }
            const pageStart = css.indexOf(".specimen-page {");
            if (pageStart < 0) {
              console.error("Homepage .specimen-page rule missing");
              process.exit(1);
            }
            const pageRule = css.slice(pageStart, css.indexOf("}", pageStart));
            if (!pageRule.includes("background: transparent") || /border:\s*1px/.test(pageRule)) {
              console.error("Homepage must let the site grid show through: transparent paper, no page border");
              process.exit(1);
            }
            const start = css.indexOf(".specimen {");
            if (start < 0) {
              console.error("Homepage .specimen rule missing");
              process.exit(1);
            }
            const rule = css.slice(start, css.indexOf("}", start));
            if (!/padding:\s*0;/.test(rule)) {
              console.error("Homepage specimen must have padding: 0");
              process.exit(1);
            }
            if (!rule.includes("background: transparent")) {
              console.error("Homepage leftover must not cover the site grid");
              process.exit(1);
            }
            if (rule.includes("background: var(--divider)")) {
              console.error("Homepage leftover must not be a divider sliver");
              process.exit(1);
            }
            if (/border-(top|right|bottom|left)/.test(rule) || /padding:\s*0\s+1px/.test(rule)) {
              console.error("Homepage must not draw a frame on any side");
              process.exit(1);
            }
            const cellAt = css.indexOf(".specimen-cell {");
            const cellRule = css.slice(cellAt, css.indexOf("}", cellAt));
            if (!cellRule.includes("background: transparent")) {
              console.error("Specimen cells must not cover the site grid");
              process.exit(1);
            }
          '
          grep -q 'KIT =' apps/www/app/specimen.ts
          grep -q 'accordion' apps/www/app/specimen.ts
          grep -q 'calendar' apps/www/app/specimen.ts
          grep -q 'field' apps/www/app/specimen.ts
          grep -q 'stepper' apps/www/app/specimen.ts
          grep -q 'SpecimenKit' apps/www/app/page.tsx
          grep -q 'SpecimenPrinciples' apps/www/app/page.tsx
          grep -q 'POSTER' apps/www/app/page.tsx
          grep -q 'specimen-index' apps/www/app/specimen-principles.tsx
          if ! awk '/^\.specimen-n \{/,/^\}/' apps/www/app/specimen.css | grep -q 'font-size: 12px'; then
            echo "Field numerals must stay a 12px index, not a poster numeral"
            exit 1
          fi
          if awk '/^\.specimen-n \{/,/^\}/' apps/www/app/specimen.css | grep -qE 'clamp\(|[3-9][0-9]px|[0-9]+rem|[0-9]+vw'; then
            echo "Field numerals must not scale like a poster numeral"
            exit 1
          fi
          if grep -n 'specimen-cell-p01 .specimen-n' apps/www/app/specimen.css; then
            echo "01 must not be a larger typographic spot"
            exit 1
          fi
          grep -q 'CopyControl' apps/www/app/page.tsx
          grep -q 'specimen-command-kicker' apps/www/app/page.tsx
          node -e '
            const { readFileSync } = require("node:fs");
            const page = readFileSync("apps/www/app/page.tsx", "utf8");
            const body = page.slice(page.indexOf("export default function Home"));
            const cmd = body.indexOf("specimen-cell-command");
            const laws = body.indexOf("<SpecimenPrinciples");
            if (cmd < 0 || laws < 0 || cmd > laws) {
              console.error("Install command must sit before the numbered laws");
              process.exit(1);
            }
            const css = readFileSync("apps/www/app/specimen.css", "utf8");
            const areas = [...css.matchAll(/grid-template-areas:\s*([^;]+);/g)].map((m) => m[1]);
            if (areas.length === 0) {
              console.error("Specimen grid areas missing");
              process.exit(1);
            }
            for (const block of areas) {
              const cmdAt = block.indexOf("cmd");
              const p01 = block.indexOf("p01");
              if (cmdAt < 0 || p01 < 0 || cmdAt > p01) {
                console.error("Command cell must precede law 01 in every specimen grid");
                process.exit(1);
              }
            }
            const start = css.indexOf(".specimen-command {");
            const end = css.indexOf("}", start);
            const rule = css.slice(start, end);
            if (!rule.includes("5rem") || !rule.includes("font-weight: 600")) {
              console.error("Install command must stay a primary poster CTA");
              process.exit(1);
            }
            const cmdCell = css.slice(css.indexOf(".specimen-cell-command {"), css.indexOf("}", css.indexOf(".specimen-cell-command {")));
            if (!cmdCell.includes("min-height: 408px")) {
              console.error("Install command cell must occupy two modules");
              process.exit(1);
            }
            for (const block of areas) {
              const rows = block.match(/"[^"]+"/g) || [];
              const cmdRows = rows.filter((row) => row.includes("cmd"));
              const onlyCmd = cmdRows.length > 0 && cmdRows.every((row) => /^"(?:cmd )*(cmd)"$/.test(row.trim()));
              if (!onlyCmd) {
                console.error("Install command must be a full-bleed CTA row, not a shared cell");
                process.exit(1);
              }
            }
          '
          test -f apps/www/app/specimen-kit.tsx
          test -f apps/www/app/specimen-laws.ts
          if grep -nE '^[[:space:]]*height: 100dvh' apps/www/app/specimen.css; then
            echo "Specimen must scroll; do not lock height to the viewport"
            exit 1
          fi
          if grep -n 'overflow: hidden' apps/www/app/specimen.css; then
            echo "Kit cells must not crop"
            exit 1
          fi
          if grep -nE 'Save|Draft|rs-switch' apps/www/app/page.tsx apps/www/app/specimen-kit.tsx; then
            echo "Homepage kit cells must not be the leftover Save / switch / Draft set"
            exit 1
          fi
          if grep -nE '"button-group"|"tabs"|"chart"' apps/www/app/specimen.ts; then
            echo "Homepage kit must not reuse the cropped button-group / tabs / chart cells"
            exit 1
          fi
          node -e '
            const { readFileSync } = require("node:fs");
            const spec = readFileSync("apps/www/app/specimen.ts", "utf8");
            const names = [...spec.matchAll(/"(accordion|calendar|field|stepper)"/g)].map((m) => m[1]);
            if (names.length !== 4) {
              console.error("KIT must name accordion, calendar, field, stepper");
              process.exit(1);
            }
            const reg = readFileSync("packages/core/src/registry.ts", "utf8");
            for (const name of names) {
              if (!reg.includes(`name: "${name}"`)) {
                console.error("KIT name missing from catalog:", name);
                process.exit(1);
              }
            }
          '
          if ! grep -q 'gallery-item' apps/www/app/site.css || ! grep -q 'background-color: var(--bg)' apps/www/app/site.css; then
            echo "Component tiles must be opaque paper"
            exit 1
          fi
          grep -q 'isolation: isolate' apps/www/app/site.css
          grep -q 'rs-crumbs a' packages/core/css/components/breadcrumbs.css
          grep -q 'a:link' packages/core/css/components/breadcrumbs.css
          grep -q 'a:visited' packages/core/css/components/breadcrumbs.css
          grep -q 'a:any-link' packages/core/css/components/breadcrumbs.css
          grep -q 'color:var(--text)' packages/core/css/components/breadcrumbs.css
          if grep -nE '#00[fF]|#0000ff|[Pp]urple|\\bblue\\b' packages/core/css/components/breadcrumbs.css; then
            echo "Breadcrumb trail must stay ink — no second link color"
            exit 1
          fi
          if grep -n '1.5px' packages/core/css/components/tabs.css; then
            echo "Tabs must use a hairline on the active tab only"
            exit 1
          fi
          if grep -n 'border-bottom:1px solid var(--divider' packages/core/css/components/tabs.css; then
            echo "Tab set must not sit on a full-width bar"
            exit 1
          fi
          grep -q 'appearance:none' packages/core/css/components/tabs.css
          grep -q 'inset 0 -1px 0 var(--text)' packages/core/css/components/tabs.css
          grep -q 'padding:8px 0 32px' packages/core/css/components/sidebar.css
          grep -q 'rs-sidebar-item:last-child' packages/core/css/components/sidebar.css
          grep -q 'padding-bottom:32px' packages/core/css/components/sidebar.css
      - name: Code blocks copy
        run: |
          block=apps/www/components/code-block.tsx
          css=apps/www/app/site.css
          grep -q 'writeText' "$block"
          grep -q 'aria-label' "$block"
          grep -q 'Copied' "$block"
          grep -q 'aria-live' "$block"
          grep -q '@noorddev/raster-react' "$block"
          grep -q 'name="copy"' "$block"
          grep -q 'name="copied"' "$block"
          grep -q 'size={16}' "$block"
          icon=packages/react/src/components/icon.tsx
          marks=packages/react/src/components/icon-marks.ts
          grep -q 'M6.5 2.5 H13.5 V9.5' "$marks"
          grep -q 'r(2.5, 6.5, 7, 7)' "$marks"
          grep -q 'M3.5 8.5 L6.5 11.5 L12.5 4.5' "$marks"
          grep -q 'strokeLinecap: "butt"' "$icon"
          grep -q 'strokeLinejoin: "miter"' "$icon"
          grep -q 'ICON_STROKE = 1' "$icon"
          grep -q 'rotate={90}' packages/react/src/components/accordion.tsx
          grep -q 'name="chevron-right"' packages/react/src/components/accordion.tsx
          grep -q 'name="check"' packages/react/src/components/checkbox.tsx
          if grep -nE 'lucide|heroicons|@heroicons' "$block" "$icon" "$marks"; then
            echo "Copy mark must stay Raster-native"
            exit 1
          fi
          if grep -nE 'strokeWidth: 1\.5|strokeLinecap: "round"' "$icon" "$marks"; then
            echo "Icons must stay a 1px butt hairline"
            exit 1
          fi
          if grep -nE 'strokeWidth="1\.5"|strokeLinecap="round"|rx=' packages/react/src/components/theme-toggle.tsx packages/react/src/components/alert.tsx packages/react/src/components/date-picker.tsx packages/react/src/components/data-table.tsx apps/www/components/site-chrome.tsx; then
            echo "Raster chrome must use the family, not a second stroke"
            exit 1
          fi
          chrome=apps/www/components/site-chrome.tsx
          grep -q 'name="sun"' "$chrome"
          grep -q 'name="moon"' "$chrome"
          grep -q '@noorddev/raster-react' "$chrome"
          grep -q 'name="calendar"' packages/react/src/components/date-picker.tsx
          grep -q 'r(3, 4.5, 10, 9)' "$marks"
          if grep -nE 'M13.5 9.5A5.5|r="3.25"' "$chrome" packages/react/src/components/theme-toggle.tsx; then
            echo "Site theme-toggle must use the Raster family"
            exit 1
          fi
          if grep -nE 'CopyMark|CopiedMark|width="8"' "$block"; then
            echo "Code-block copy must use the Raster Icon, not the overlapping squares"
            exit 1
          fi
          grep -q 'code-copy' "$css"
          grep -q 'CopyControl' apps/www/app/page.tsx
          grep -q 'CodeBlock' apps/www/app/docs/page.tsx
          grep -q 'Coming from Raster 0.1' apps/www/app/docs/page.tsx
          if grep -nE 'toast|Toaster|rs-toast' "$block"; then
            echo "Copy must confirm on the control, not via toast"
            exit 1
          fi
          if grep -nE 'tailwind|@radix|@radix-ui' "$block" "$css"; then
            echo "Copy control must stay CSS-first"
            exit 1
          fi
          if grep -Rn '<pre>' apps/www --include='*.tsx' | grep -v code-block.tsx; then
            echo "Command and code blocks must go through CodeBlock"
            exit 1
          fi
          node -e '
            const { readFileSync } = require("node:fs");
            const css = readFileSync("apps/www/app/site.css", "utf8");
            const copy = css.slice(css.indexOf(".code-copy {"), css.indexOf(".code-copy:hover"));
            if (!copy.includes("border-radius: 0") || !copy.includes("box-shadow: none")) {
              console.error("Copy chrome must be flush: no radius, no shadow");
              process.exit(1);
            }
          '
      - name: Every component has an isolated Use
        run: |
          test -f apps/www/components/examples/use.css
          test -f apps/www/components/examples/use-slot.tsx
          grep -q '184px minmax(0, 1fr)' apps/www/components/examples/use.css
          grep -q 'rs-use-in' apps/www/components/examples/use.css
          if grep -n border-left apps/www/components/examples/use.css; then
            echo "Use field must not grow a left rule"
            exit 1
          fi
          if [ -f apps/www/components/examples/index.tsx ]; then
            echo "Uses must stay one file per component, not a shared dump"
            exit 1
          fi
          node apps/www/scripts/check-examples.mjs
          grep -q 'The control, the name, a short law.' apps/www/app/components/page.tsx
          grep -q 'className="rs-scene"' apps/www/components/examples/scene.tsx
          grep -q '.rs-scene .rs-use-type' apps/www/components/examples/use.css
      - name: About is a modernist homage
        run: |
          page=apps/www/app/about/page.tsx
          facts=apps/www/app/about/facts.ts
          css=apps/www/app/about/about.css
          test -f "$page"
          test -f "$facts"
          test -f "$css"
          grep -q 'homage' "$facts"
          grep -q 'Swiss Style' "$facts"
          grep -q 'Dutch modernism' "$facts"
          grep -q 'Josef Müller-Brockmann' "$facts"
          grep -q 'Wim Crouwel' "$facts"
          grep -q 'Max Bill' "$facts"
          grep -q 'Karl Gerstner' "$facts"
          grep -q 'Emil Ruder' "$facts"
          grep -q 'Armin Hofmann' "$facts"
          grep -q 'Piet Zwart' "$facts"
          grep -q 'Paul Schuitema' "$facts"
          grep -q 'Otto Treumann' "$facts"
          grep -q 'Total Design' "$facts"
          grep -q 'Neue Grafik' "$facts"
          grep -q 'Grid Systems' "$facts"
          grep -q 'heading: "Typeface"' "$facts"
          grep -q 'heading: "Noord"' "$facts"
          grep -q 'door: DOOR' "$facts"
          grep -q 'getraster.com' apps/www/app/specimen.ts
          grep -q 'heading: "Renato Valdés Olmos"' "$facts"
          grep -q 'foundry.license' "$facts"
          grep -q 'meta.url' "$facts"
          grep -q '@noorddev/raster' "$facts"
          if grep -n 'npx @noordvc' "$facts" "$page"; then
            echo "About install copy must say @noorddev, not @noordvc"
            exit 1
          fi
          grep -q 'type.foundry' "$facts"
          grep -q 'AI lab' "$facts"
          grep -q 'Alkmaar' "$facts"
          grep -q 'Silicon Valley' "$facts"
          grep -q 'designed and built' "$facts"
          grep -q 'field-page' "$page"
          grep -q 'field-face' "$css"
          grep -q 'field-name-feature' "$css"
          grep -q 'field-colophon' "$css"
          grep -q 'field-colophon' "$page"
          grep -q 'field-spec-module' "$page"
          grep -q 'field-spec-hair' "$page"
          grep -q 'field-spec-flush' "$page"
          grep -q 'padding: 0 1px 1px 0' "$css"
          node -e '
            const { readFileSync } = require("node:fs");
            const css = readFileSync("apps/www/app/about/about.css", "utf8");
            const cell = css.slice(css.indexOf(".field-cell {"), css.indexOf("}", css.indexOf(".field-cell {")));
            if (!cell.includes("background-image: var(--grid-image)") || !cell.includes("background-position: var(--grid-pos)") || !cell.includes("background-attachment: fixed")) {
              console.error("About cells must paint the same fixed site 204 as home");
              process.exit(1);
            }
            const era = css.slice(css.indexOf(".field-cell-era {"), css.indexOf("}", css.indexOf(".field-cell-era {")));
            if (era.includes("background-image")) {
              console.error("About hero must not paint a local unpositioned grid");
              process.exit(1);
            }
          '
          grep -q 'field-grotesque' "$page"
          grep -q '204' "$facts"
          grep -q 'Hairlines' "$facts"
          grep -q 'No radius' "$facts"
          if grep -nE 'masthead-noord|masthead-typeface|masthead-renato' "$page"; then
            echo "Credits must not occupy masthead ids"
            exit 1
          fi
          if grep -nE 'field-face">|field-face |field-name-feature">' "$page" | grep -nE 'Noord|Inter|Renato'; then
            echo "Credits must not be the About face"
            exit 1
          fi
          if grep -nE 'venture studio|Ten portfolio|ten portfolio' "$facts" "$page"; then
            echo "About must not lead with the venture-studio line"
            exit 1
          fi
          if grep -nE 'our team|the team|team page|we are a' "$facts" "$page"; then
            echo "About must not be a team page"
            exit 1
          fi
          if grep -n 'overflow: hidden' "$css"; then
            echo "About field cells must not crop"
            exit 1
          fi
          node -e '
            const { readFileSync } = require("node:fs");
            const css = readFileSync("apps/www/app/about/about.css", "utf8");
            const start = css.indexOf(".field-colophon p {");
            if (start < 0) {
              console.error("Colophon type rule missing");
              process.exit(1);
            }
            const rule = css.slice(start, css.indexOf("}", start));
            if (!rule.includes("font-size: 12px") || !rule.includes("--text-secondary")) {
              console.error("Colophon must stay 12px and secondary");
              process.exit(1);
            }
          '
          grep -q 'SIL OFL 1.1' packages/core/src/tokens.ts
          if grep -n Messina "$page" "$facts" "$css"; then
            echo "About must not name Messina"
            exit 1
          fi
          if grep -n about.css apps/www/app/site.css; then
            echo "About styles must stay isolated"
            exit 1
          fi
          grep -q 'href: "/about"' apps/www/components/site-chrome.tsx
          grep -q 'label: "About"' apps/www/components/site-chrome.tsx
          if grep -n border-left "$css"; then
            echo "About field must not grow a left rule"
            exit 1
          fi
          if grep -nE 'box-shadow:[^n]|border-radius:[^0]' "$css"; then
            echo "About must stay flush: no shadow, no radius"
            exit 1
          fi
      - name: Interfaces is six posters
        run: |
          node apps/www/scripts/check-interfaces.mjs
          grep -q 'href: "/interfaces"' apps/www/components/site-chrome.tsx
          grep -q 'label: "Interfaces"' apps/www/components/site-chrome.tsx
          test -f apps/www/app/interfaces/FEATURE.md
          test -f apps/www/app/interfaces/catalog.ts
          test -f apps/www/app/interfaces/page.tsx
          test -f apps/www/app/interfaces/interfaces.css
          for slug in line press wall night evening room; do
            test -f "apps/www/app/interfaces/$slug/page.tsx"
            test -f "apps/www/app/interfaces/$slug/board.tsx"
          done
          test -f apps/www/app/interfaces/night/map.tsx
          test -f apps/www/app/interfaces/crops.tsx
          test -f apps/www/app/interfaces/shell.tsx
          grep -q 'InterfaceCrop' apps/www/app/interfaces/page.tsx
          grep -q 'poster crop' apps/www/app/interfaces/page.tsx
          grep -q 'boxed specimen' apps/www/app/interfaces/FEATURE.md
          grep -qi 'no tape' apps/www/app/interfaces/FEATURE.md
          grep -qi 'minimal shadow' apps/www/app/interfaces/FEATURE.md
          grep -q 'if-inspect' apps/www/app/interfaces/FEATURE.md
          grep -q 'No rule under the description' apps/www/app/interfaces/FEATURE.md
          grep -q 'title: "Line"' apps/www/app/interfaces/catalog.ts
          grep -q 'title: "Press"' apps/www/app/interfaces/catalog.ts
          grep -q 'title: "Wall"' apps/www/app/interfaces/catalog.ts
          grep -q 'title: "Night"' apps/www/app/interfaces/catalog.ts
          grep -q 'title: "Evening"' apps/www/app/interfaces/catalog.ts
          grep -q 'title: "Room"' apps/www/app/interfaces/catalog.ts
          grep -q 'if-specimen' apps/www/app/interfaces/shell.tsx
          grep -q 'if-meta' apps/www/app/interfaces/shell.tsx
          if [ -f apps/www/app/interfaces/scene-fonts.ts ]; then
            echo "Scenes must use Inter, not extra display faces"
            exit 1
          fi
          if grep -R -n -E 'Fraunces|Source_Serif|IBM_Plex|Newsreader|aubergine|#c96442|#3e1242|#007a5a|#1f8a78' apps/www/app/interfaces; then
            echo "Interfaces scenes must not wear a product skin"
            exit 1
          fi
          if grep -R -n -E 'tailwind|@radix-ui' apps/www/app/interfaces; then
            echo "Interfaces must stay off Tailwind and Radix"
            exit 1
          fi
          node -e '
            const { readFileSync } = require("node:fs");
            const css = readFileSync("apps/www/app/interfaces/interfaces.css", "utf8");
            const tile = css.slice(css.indexOf(".if-tile {"), css.indexOf("}", css.indexOf(".if-tile {")));
            if (!tile.includes("box-shadow: none")) {
              console.error("Landing tiles must stay flush: no shadow");
              process.exit(1);
            }
            const spec = css.slice(css.indexOf(".if-specimen {"), css.indexOf("}", css.indexOf(".if-specimen {")));
            if (!spec.includes("box-shadow:") || spec.includes("box-shadow: none")) {
              console.error("Specimen may take a quiet shadow");
              process.exit(1);
            }
          '
          for slug in line press wall night evening room; do
            grep -q 'if-inspect' "apps/www/app/interfaces/$slug/board.tsx"
          done
          if grep -n about.css apps/www/app/site.css || grep -n interfaces.css apps/www/app/site.css; then
            echo "Interfaces styles must stay isolated"
            exit 1
          fi
      - name: Components TOC is catalog groups
        run: |
          nav=apps/www/components/docs-nav/index.tsx
          map=apps/www/components/docs-nav/FEATURE.md
          test -f "$map"
          grep -q Navigation "$map"
          grep -q 'second column' "$map"
          if grep -n Foundations "$nav"; then
            echo "Components TOC must not use Foundations as a first-column item"
            exit 1
          fi
          grep -q 'rasterCategories' "$nav"
          grep -q 'data-toc="groups"' "$nav"
          grep -q 'data-toc="items"' "$nav"
          grep -q 'data-rail="catalog"' "$nav"
          grep -q 'max-width: 1439px' apps/www/components/docs-nav/docs-nav.css
          grep -q '1440' "$map"
          if grep -n toc-rail apps/www/app/site.css; then
            echo "Docs-rail styles drifted back into site chrome"
            exit 1
          fi
          if grep -n border-left apps/www/components/docs-nav/docs-nav.css; then
            echo "Secondaries column must not grow its own left rule"
            exit 1
          fi
          if awk '/^\.toc-sub \{/,/^\}/' apps/www/components/docs-nav/docs-nav.css | grep -E 'background:\s*var\(--bg\)'; then
            echo "Catalog secondaries must not cover the site module grid"
            exit 1
          fi
          grep -q 'background: transparent' apps/www/components/docs-nav/docs-nav.css
          grep -q 'width: 204px' apps/www/components/docs-nav/docs-nav.css
          grep -q '408 module line' apps/www/components/docs-nav/docs-nav.css
          if grep -n 'margin-left: 1px' apps/www/components/docs-nav/docs-nav.css; then
            echo "Secondaries must occupy gutter + column (204), not a 1px nudge"
            exit 1
          fi
          node apps/www/scripts/check-mobile.mjs
          grep -q 'MobileToc' apps/www/components/docs-nav/index.tsx
          grep -q '44pt' apps/www/components/docs-nav/FEATURE.md
          grep -q 'viewportFit' apps/www/app/layout.tsx
      - name: Charts are posters
        run: |
          css=packages/core/css/components/chart.css
          grep -q 'stroke-linecap:butt' "$css"
          grep -q 'border-radius:0' "$css"
          grep -q 'box-shadow:none' "$css"
          grep -q 'stroke-width:1' "$css"
          if grep -nE 'stroke-linecap:round|box-shadow:[^n]|rx=\{' "$css" packages/react/src/components/charts/*.tsx; then
            echo "Charts must stay hairline, flush, no shadow, no rounded bars"
            exit 1
          fi
          if grep -nE '#[Ee]30613|#[Ff][Ff]0000' "$css"; then
            echo "Crouwel spot must not live in CSS"
            exit 1
          fi
          for n in chart bar-chart area-chart scatter-chart donut histogram small-multiples; do
            test -f "apps/www/components/examples/$n/use.tsx"
          done
          grep -q ToggleGroup apps/www/components/examples/chart/use.tsx
          test -d packages/react/src/components/charts
          test -f packages/react/src/components/charts/line.tsx
          test -f packages/react/src/components/charts/bar.tsx
          test -f packages/react/src/components/charts/scatter.tsx
      - name: Motion is quiet
        run: |
          tokens=packages/core/src/tokens.ts
          chart=packages/core/css/components/chart.css
          site=apps/www/app/site.css
          form=packages/core/css/components/inline-form.css
          theme=packages/core/css/components/theme-toggle.css
          toast=packages/core/css/components/toast.css
          grep -q 'snap: "0.12s"' "$tokens"
          grep -q 'ease: "0.18s"' "$tokens"
          grep -q 'confirm: "0.16s"' "$tokens"
          grep -q 'cubic-bezier(0.2, 0, 0, 1)' "$tokens"
          grep -q 'Entry is not a show' "$tokens"
          grep -qF -- '--duration-snap' packages/core/scripts/build.mjs
          grep -qF -- '--ease' packages/core/scripts/build.mjs
          if grep -n 'rs-chart-enter\|rs-chart-in\|@keyframes' "$chart"; then
            echo "Charts must not fade in on load"
            exit 1
          fi
          if grep -nE 'stagger|animation-delay' "$chart" "$site" apps/www/app/specimen.css apps/www/app/about/about.css apps/www/app/interfaces/*/scene.css apps/www/app/interfaces/scene-motion.css; then
            echo "No staggered reveals"
            exit 1
          fi
          if grep -nE 'translateY' apps/www/app/interfaces/*/scene.css apps/www/app/interfaces/scene-motion.css; then
            echo "Interface scenes must not fade-up"
            exit 1
          fi
          grep -q 'Entry is not a show' apps/www/app/interfaces/FEATURE.md
          grep -q '@keyframes sc-confirm' apps/www/app/interfaces/scene-motion.css
          for slug in line press wall night evening room; do
            grep -q 'var(--duration-snap)' "apps/www/app/interfaces/$slug/scene.css"
            grep -q 'var(--ease)' "apps/www/app/interfaces/$slug/scene.css"
            grep -q 'sc-fresh' "apps/www/app/interfaces/$slug/board.tsx"
          done
          if grep -nE 'scale\(\.92\)|translateX\(-6px\)|translateY\((4|6)px\)' "$form" "$toast" packages/core/css/components/crumb-bar.css; then
            echo "Fade-up and scale shows are out"
            exit 1
          fi
          if grep -nE '\.5s cubic-bezier|rotate\(-90deg\)|rotate\(90deg\)' "$theme" "$site"; then
            echo "Theme toggle must snap, not spin for half a second"
            exit 1
          fi
          if grep -n 'translateY(-6px)' "$site"; then
            echo "Nav panel must not drop in"
            exit 1
          fi
          grep -q 'var(--duration-snap)' "$site"
          grep -q 'var(--duration)' "$site"
          grep -qF 'code-copy[aria-label="Copied"]' "$site"
          grep -q '{motion.rule}' apps/www/app/docs/tokens/page.tsx
          grep -q '{motion.snap}' apps/www/app/docs/tokens/page.tsx
          if grep -nE 'tailwind|@radix-ui' "$tokens" "$site" packages/core/css/motion.css; then
            echo "Motion must stay CSS-first"
            exit 1
          fi
